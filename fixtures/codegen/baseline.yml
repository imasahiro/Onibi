---
schema_version: 1
ruby_version: "4.0.6"
recorded_on: "2026-08-11"
engine: "hfa"
syntax_fixture: fixtures/syntax/core.yml
ast_nodes:
- Absence
- Alternation
- Anchor
- Any
- Assertion
- AtomicGroup
- Backreference
- CharacterClass
- Conditional
- Escape
- Group
- Literal
- OptionGroup
- Property
- Quantifier
- Sequence
- SubexpressionCall
public_surfaces:
- Onibi::Regexp#match
- Onibi::Regexp#match?
- Onibi::Regexp#=~
- Onibi::Regexp#===
- Onibi::Regexp#~
- Onibi::Regexp#scan
- Onibi::Regexp#gsub
encodings:
- utf8
- ascii8bit
- euc_jp
- windows_31j
benchmark_workloads:
- literal_short
- literal_long_mismatch
- alternation_capture
- greedy_repetition
- assertion
- backreference
- unicode_casefold
- pathological_mismatch
benchmark_method:
  iterations: 1000
  reports: compile_time, first_match, warm_match, allocations, peak_memory
baseline_observation:
  status: hfa_public_matcher
  notes: >-
    These workloads document the public HFA matcher and are checked against MRI
    by the acceptance and differential suites.
benchmark_cases:
  literal_short:
    pattern: cat
    input: catnap
  literal_long_mismatch:
    pattern: a+b
    input: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaac
  alternation_capture:
    pattern: (a|aa)(b|bb)
    input: aabb
  greedy_repetition:
    pattern: (a*)b
    input: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaab
  assertion:
    pattern: (?=a)a
    input: a
  backreference:
    pattern: (a)\1
    input: aa
  unicode_casefold:
    pattern: ß
    options:
    - ignorecase
    input: SS
  pathological_mismatch:
    pattern: (a*)*b
    input: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaac
