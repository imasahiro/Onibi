name: Ruby

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.6'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run MRI baseline and acceptance suites
        run: bundle exec rake test
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Build gem
        run: bundle exec rake build
      - name: Install and smoke test gem
        run: |
          gem_home="$(mktemp -d)"
          trap 'rm -rf "$gem_home"' EXIT
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" gem install --local pkg/onibi-*.gem --no-document
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" ruby -e '
            require "onibi"
            regexp = Onibi::Regexp.new("(?<word>a+)")
            match = regexp.match("xxaaa")
            abort unless match && match["word"] == "aaa"
            abort unless regexp.scan("baacaa").flatten == ["aa", "aa"]
            abort unless regexp.gsub("baacaa", "x") == "bxcx"
          '
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-ruby-${{ matrix.ruby }}
          path: coverage/
          if-no-files-found: warn
      - name: Comment coverage report on pull request
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('coverage/.resultset.json') != '' }}
        uses: actions/github-script@v7
        env:
          COVERAGE_RESULTSET: coverage/.resultset.json
          RUBY_VERSION: ${{ matrix.ruby }}
        with:
          script: |
            const fs = require("fs");
            const resultset = JSON.parse(fs.readFileSync(process.env.COVERAGE_RESULTSET, "utf8"));
            const files = Object.values(resultset).flatMap((result) => Object.values(result.coverage || {}));
            const lines = files.flatMap((file) => file.lines || []).filter((line) => line !== null);
            const covered = lines.filter((line) => line > 0).length;
            const percentage = lines.length === 0 ? 0 : ((covered / lines.length) * 100).toFixed(2);
            const marker = "<!-- onibi-coverage-report -->";
            const body = [
              marker,
              "## Coverage report",
              "",
              `Line coverage: **${percentage}%** (${covered}/${lines.length} lines)`,
              "",
              `Generated by ${context.workflow} for Ruby ${process.env.RUBY_VERSION || "4.0.6"}.`
            ].join("\\n");
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.data.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
