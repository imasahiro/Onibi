name: Ruby

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.6'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run gem acceptance suite
        run: bundle exec rake test:acceptance
        env:
          SEED: 51748
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Build gem
        run: bundle exec rake build
      - name: Install and smoke test gem
        run: |
          gem_home="$(mktemp -d)"
          trap 'rm -rf "$gem_home"' EXIT
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" gem install --local pkg/onibi-*.gem --no-document
          GEM_HOME="$gem_home" GEM_PATH="$gem_home" ruby -e '
            require "onibi"
            regexp = Onibi::Regexp.new("(?<word>a+)")
            match = regexp.match("xxaaa")
            abort unless match && match["word"] == "aaa"
            abort unless regexp.scan("baacaa").flatten == ["aa", "aa"]
            abort unless regexp.gsub("baacaa", "x") == "bxcx"
          '
      - name: Run complete legacy suite and verify its result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          stdout_file=ci-artifacts/legacy-stdout.txt
          stderr_file=ci-artifacts/legacy-stderr.txt
          status_file=ci-artifacts/legacy-exit.txt

          if bundle exec rake test >"$stdout_file" 2>"$stderr_file"; then
            status=0
          else
            status=$?
          fi
          printf '%s\n' "$status" >"$status_file"
          cat "$stdout_file"
          cat "$stderr_file" >&2
          printf 'Legacy suite exit status: `%s`\n' "$status" >>"$GITHUB_STEP_SUMMARY"

          summary_count="$(grep -Ec '^[0-9]+ runs, [0-9]+ assertions, [0-9]+ failures, [0-9]+ errors, [0-9]+ skips$' "$stdout_file" || true)"
          summary="$(grep -E '^[0-9]+ runs, [0-9]+ assertions, [0-9]+ failures, [0-9]+ errors, [0-9]+ skips$' "$stdout_file" || true)"
          excluded_count="$(grep -F -c 'RegexpUtilityTest#test_last_match_matches_mri_and_match_question_does_not_change_it' "$stdout_file" || true)"

          if [[ "$status" -eq 0 ]] &&
             [[ "$summary_count" -eq 1 ]] &&
             [[ "$summary" =~ ^[1-9][0-9]*\ runs,\ [0-9]+\ assertions,\ 0\ failures,\ 0\ errors,\ 0\ skips$ ]] &&
             [[ "$excluded_count" -eq 0 ]]; then
            echo 'The complete legacy suite passed.'
          elif [[ "$status" -eq 1 ]] &&
               [[ "$summary_count" -eq 1 ]] &&
               [[ "$summary" =~ ^[1-9][0-9]*\ runs,\ [0-9]+\ assertions,\ 1\ failures,\ 0\ errors,\ 0\ skips$ ]] &&
               [[ "$excluded_count" -eq 1 ]]; then
            echo 'The complete legacy suite has only its documented failure.'
          else
            echo 'The complete legacy suite has an unexpected result.' >&2
            exit 1
          fi
        env:
          SEED: 51748
      - name: Upload complete legacy suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-suite-ruby-${{ matrix.ruby }}
          path: ci-artifacts/
          if-no-files-found: warn
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-ruby-${{ matrix.ruby }}
          path: coverage/
          if-no-files-found: warn
      - name: Comment coverage report on pull request
        if: ${{ always() && github.event_name == 'pull_request' && hashFiles('coverage/.resultset.json') != '' }}
        uses: actions/github-script@v7
        env:
          COVERAGE_RESULTSET: coverage/.resultset.json
          RUBY_VERSION: ${{ matrix.ruby }}
        with:
          script: |
            const fs = require("fs");
            const resultset = JSON.parse(fs.readFileSync(process.env.COVERAGE_RESULTSET, "utf8"));
            const files = Object.values(resultset)
              .flatMap((result) => Object.entries(result.coverage || {}))
              .filter(([path]) => path.includes("/lib/"))
              .map(([, file]) => file);
            const lines = files.flatMap((file) => file.lines || []).filter((line) => line !== null);
            const covered = lines.filter((line) => line > 0).length;
            const percentage = lines.length === 0 ? 0 : ((covered / lines.length) * 100).toFixed(2);
            const marker = "<!-- onibi-coverage-report -->";
            const body = [
              marker,
              "## Production lib/ coverage report",
              "",
              `Line coverage: **${percentage}%** (${covered}/${lines.length} lines)`,
              "",
              `Generated by ${context.workflow} for Ruby ${process.env.RUBY_VERSION || "4.0.6"}.`
            ].join("\n");
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.data.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
