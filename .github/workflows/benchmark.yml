name: Benchmark comparison

on:
  pull_request:
    paths:
      - lib/**

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true

      - name: Check out base revision
        uses: actions/checkout@v6
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Benchmark base revision
        run: ONIBI_ROOT="$GITHUB_WORKSPACE/base" bundle exec ruby script/benchmark_report.rb --time 2 --warmup 1 --output /tmp/onibi-benchmark-before.json

      - name: Benchmark pull request revision
        run: ONIBI_ROOT="$GITHUB_WORKSPACE" bundle exec ruby script/benchmark_report.rb --time 2 --warmup 1 --output /tmp/onibi-benchmark-after.json

      - name: Render benchmark comment
        run: |
          bundle exec ruby script/benchmark_report.rb \
            --compare /tmp/onibi-benchmark-before.json,/tmp/onibi-benchmark-after.json \
            --markdown-output /tmp/onibi-benchmark-comment.md

      - name: Update benchmark comment
        uses: actions/github-script@v7
        env:
          COMMENT_PATH: /tmp/onibi-benchmark-comment.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- onibi-benchmark-report -->";
            const body = fs.readFileSync(process.env.COMMENT_PATH, "utf8");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
      - name: Fail on benchmark regression above 10 percent
        run: |
          bundle exec ruby script/benchmark_report.rb \
            --compare /tmp/onibi-benchmark-before.json,/tmp/onibi-benchmark-after.json \
            --max-regression 0.10
