AllCops:
  TargetRubyVersion: 4.0

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Naming/FileName:
  Exclude:
    - "benchmark/regex-redux.rb"

# The parser and acceptance scenarios are cohesive units; keep their size
# bounded by the largest reviewed implementation rather than splitting them
# across artificial wrapper files.
Metrics/ClassLength:
  Max: 125
  Exclude:
    - "script/profile_regex_redux.rb"
    - "script/profile_regexp_features.rb"
    - "script/profile_regexp_scaling.rb"
    - "script/profile_compile_stages.rb"

# The profiling harness intentionally keeps measurement, reporting, and CLI
# orchestration together so a run remains a single reproducible command.
Metrics/AbcSize:
  Exclude:
    - "script/profile_regex_redux.rb"
    - "script/profile_regexp_features.rb"
    - "script/profile_regexp_scaling.rb"
    - "script/profile_compile_stages.rb"

Metrics/MethodLength:
  Max: 15
  Exclude:
    - "script/profile_regex_redux.rb"
    - "script/profile_regexp_features.rb"
    - "script/profile_regexp_scaling.rb"
    - "script/profile_compile_stages.rb"

Metrics/ModuleLength:
  Max: 220

Metrics/CyclomaticComplexity:
  Max: 9

Metrics/PerceivedComplexity:
  Max: 9
