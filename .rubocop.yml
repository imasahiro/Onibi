AllCops:
  TargetRubyVersion: 4.0
  # The HFA cutover keeps the matcher and its regression corpus cohesive;
  # these files are tracked as a dedicated lint-cleanup baseline.
  Exclude:
    - "vendor/**/*"
    - "lib/onibi.rb"
    - "lib/onibi/regexp_scan_gsub.rb"
    - "lib/onibi/codegen.rb"
    - "lib/onibi/hybrid_automata.rb"
    - "lib/onibi/hybrid_automata_support.rb"
    - "lib/onibi/match_data.rb"
    - "test/features/api/match_api_test.rb"
    - "test/features/captures/match_data_test.rb"
    - "test/features/encoding/encoding_test.rb"
    - "test/features/engine/hfa_fallback_inventory_test.rb"
    - "test/features/engine/hfa_standalone_frontend_test.rb"
    - "test/features/engine/hybrid_automata_test.rb"
    - "test/features/matching/scan_gsub_test.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Naming/FileName:
  Exclude:
    - "benchmark/regex-redux.rb"

# The parser and acceptance scenarios are cohesive units; keep their size
# bounded by the largest reviewed implementation rather than splitting them
# across artificial wrapper files.
Metrics/ClassLength:
  Max: 125
  Exclude:
    - "lib/onibi/search_plan.rb"
    - "script/profile_regex_redux.rb"
    - "script/profile_regexp_features.rb"
    - "script/profile_regexp_scaling.rb"
    - "script/profile_compile_stages.rb"

# The profiling harness intentionally keeps measurement, reporting, and CLI
# orchestration together so a run remains a single reproducible command.
Metrics/AbcSize:
  Exclude:
    - "lib/onibi/search_plan.rb"
    - "script/profile_regex_redux.rb"
    - "script/profile_regexp_features.rb"
    - "script/profile_regexp_scaling.rb"
    - "script/profile_compile_stages.rb"

Metrics/MethodLength:
  Max: 15
  Exclude:
    - "lib/onibi/search_plan.rb"
    - "script/profile_regex_redux.rb"
    - "script/profile_regexp_features.rb"
    - "script/profile_regexp_scaling.rb"
    - "script/profile_compile_stages.rb"

Metrics/ModuleLength:
  Max: 220

Metrics/CyclomaticComplexity:
  Max: 9
  Exclude:
    - "lib/onibi/search_plan.rb"

Metrics/PerceivedComplexity:
  Max: 9
  Exclude:
    - "lib/onibi/search_plan.rb"
